name: Terraform Checks (no deploy)
on:
  push:
    paths: ['infrastructure/terraform/**', '.github/workflows/terraform-checks.yml']
  pull_request:
    paths: ['infrastructure/terraform/**', '.github/workflows/terraform-checks.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Format
        run: terraform -chdir=infrastructure/terraform/aws-s3-sandbox fmt -check
      - name: Initialize without backend
        run: terraform -chdir=infrastructure/terraform/aws-s3-sandbox init -backend=false
      - name: Validate
        run: terraform -chdir=infrastructure/terraform/aws-s3-sandbox validate
      - name: IaC security scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          exit-code: '1'
          severity: HIGH,CRITICAL
