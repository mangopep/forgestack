name: Terraform Checks (no deploy)
on:
  push:
    paths: ['infrastructure/terraform/**', '.github/workflows/terraform-checks.yml']
  pull_request:
    paths: ['infrastructure/terraform/**', '.github/workflows/terraform-checks.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Format
        run: terraform -chdir=infrastructure/terraform/aws-s3-sandbox fmt -check
      - name: Initialize without backend
        run: terraform -chdir=infrastructure/terraform/aws-s3-sandbox init -backend=false
      - name: Validate
        run: terraform -chdir=infrastructure/terraform/aws-s3-sandbox validate
      - name: IaC security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          exit-code: '1'
          severity: HIGH,CRITICAL
