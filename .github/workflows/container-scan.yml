name: Container Image Scan (no push)
on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'go.mod', 'go.sum', 'cmd/**', 'internal/**', '.github/workflows/container-scan.yml']
  pull_request:
    paths: ['Dockerfile', 'go.mod', 'go.sum', 'cmd/**', 'internal/**', '.github/workflows/container-scan.yml']
permissions:
  contents: read
jobs:
  trivy-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image locally (not pushed to any registry)
        run: docker build -t forgestack:ci-scan .
      - name: Scan built image for known vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: forgestack:ci-scan
          exit-code: '1'
          severity: HIGH,CRITICAL
