name: Container Image Scan (no push)
# Deliberately NOT path-filtered at the `on:` level. A workflow-level `paths:`
# filter means the workflow never runs at all for a PR that doesn't touch
# those paths — so the `trivy-image` check context never gets reported, and
# if this check is marked "required" in branch protection/rulesets, GitHub
# either blocks the merge forever waiting for a status that never arrives,
# or (depending on ruleset settings) is treated as satisfied despite never
# running. Path-relevance is instead decided INSIDE the job (see "Detect
# relevant changes" below), so the job always runs and always reports a
# real success/failure — never a missing or skipped required check.
on:
  push:
    branches: [main, staging, develop]
  pull_request: {}
permissions:
  contents: read
jobs:
  trivy-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect relevant changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA...$HEAD_SHA"
          else
            range="$BEFORE_SHA...$GITHUB_SHA"
          fi
          # fetch-depth: 0 above already gives full history, so this diff
          # doesn't need another fetch. If the diff command itself fails for
          # any reason (e.g. an unresolvable ref on a brand-new branch), fail
          # safe toward running the real scan rather than skipping it.
          if git diff --name-only "$range" -- Dockerfile go.mod go.sum cmd internal .github/workflows/container-scan.yml > /tmp/changed.txt 2>/tmp/changed.err; then
            if [ -s /tmp/changed.txt ]; then
              echo "relevant=true" >> "$GITHUB_OUTPUT"
            else
              echo "relevant=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::could not compute diff ($range); scanning anyway as a fail-safe default" >&2
            cat /tmp/changed.err >&2
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build image locally (not pushed to any registry)
        if: steps.changed.outputs.relevant == 'true'
        run: docker build -t forgestack:ci-scan .
      - name: Scan built image for known vulnerabilities
        if: steps.changed.outputs.relevant == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: forgestack:ci-scan
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: No image-affecting changes — explicit pass
        if: steps.changed.outputs.relevant == 'false'
        run: echo "No Dockerfile/go.mod/go.sum/cmd/internal changes in this diff; scan intentionally not re-run. This step exists so the job always reports a real success, not a skip."
