name: CI and Quality Gates
on:
  push:
    branches: [main, staging, develop]
  pull_request:
permissions:
  contents: read
jobs:
  go-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
      - name: Formatting check
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Static analysis
        run: go vet ./...
      - name: Lint (duplication, complexity, concurrency, error handling, security)
        # Runs for every PR including forks (ci.yml needs no elevated
        # permissions for this) — the only enforced lint path for external
        # contributors. automated-review.yml's reviewdog step additionally
        # posts inline annotations, but only for same-repo PRs.
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: 'v2.15.0'
      - name: Tests with race detector and coverage report
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1
      - name: Build API
        run: go build ./cmd/api
  security-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Local secrets / risky config checks
        run: python3 scripts/review_guard.py --ci
      - name: Dependency vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: '1.27.4'
          go-package: ./...
