name: Documentation Checks
on:
  push:
    branches: [main, staging, develop]
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Regenerate deterministic docs
        run: go run ./cmd/docgen generate all

      - name: Fail if generated docs are stale (source changed, docs didn't)
        run: |
          if ! git diff --exit-code -- docs/generated; then
            echo "::error::Generated documentation under docs/generated/ is out of sync with its source."
            echo "::error::Run 'go run ./cmd/docgen generate all' locally and commit the result."
            exit 1
          fi

      - name: Check for broken relative Markdown links
        run: go run ./cmd/docgen checklinks .

      - name: Validate every Mermaid diagram actually parses and renders
        # Mermaid diagrams render client-side only (see
        # docs/handbook/DOCS-DEVELOPMENT.md) — a successful `docusaurus
        # build` proves the page built, not that the diagram syntax inside
        # it is valid Mermaid. This independently renders every ```mermaid
        # block with the real mermaid-cli parser/renderer.
        run: scripts/validate-mermaid.sh

      - name: Report documentation impact (advisory for manual-kind areas)
        if: github.event_name == 'pull_request'
        run: |
          go run ./cmd/docgen impact --base "origin/${{ github.event.pull_request.base.ref }}" --head "${{ github.event.pull_request.head.sha }}" > impact.json
          cat impact.json
          python3 - <<'PYEOF'
          import json
          with open("impact.json") as f:
              report = json.load(f)
          summary_path = __import__("os").environ.get("GITHUB_STEP_SUMMARY")
          lines = ["### Documentation impact report", ""]
          if not report["impacted_areas"]:
              lines.append("No documentation areas impacted by this change.")
          else:
              lines.append("| Area | Doc | Kind | Matched files |")
              lines.append("|---|---|---|---|")
              for a in report["impacted_areas"]:
                  kind_note = "enforced above (generated)" if a["kind"] == "generated" else "**please review manually**"
                  lines.append(f"| {a['area']} | `{a['doc_path']}` | {kind_note} | {', '.join(a['matched_files'])} |")
              lines.append("")
              lines.append("This report is advisory for manual-kind areas; it does not fail the build on its own (an AI/heuristic opinion must not be a mandatory gate). Generated-kind areas are already enforced by the step above.")
          text = "\n".join(lines)
          print(text)
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(text + "\n")
          PYEOF

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies (lockfile-pinned, reproducible)
        working-directory: website
        run: npm ci
      - name: Dependency vulnerability scan (against a reviewed, dated baseline — see issue #35)
        working-directory: website
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          python3 ../scripts/check-npm-audit-baseline.py /tmp/npm-audit.json .security/npm-audit-baseline.json
      - name: Build the documentation site (build-only — no deploy on PRs)
        working-directory: website
        run: npm run build
