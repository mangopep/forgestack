name: Automated PR Code Reviewer
on:
  pull_request:
permissions:
  contents: read
  checks: write
jobs:
  reviewdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Avoid granting write privileges to untrusted fork code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-golangci-lint@284129a3ac23bc5d8ac1522e0b6511df74a8836d # v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Pinned explicitly: this action defaults to "latest" if omitted,
          # which is an unpinned, silently-movable dependency on CI's lint
          # behavior — the same supply-chain concern already applied to
          # every other third-party Action in this repo.
          golangci_lint_version: 'v2.15.0'
          # github-pr-check posts inline Check annotations (GitHub Checks
          # API), not PR conversation comments — this is what avoids
          # duplicate/spammy bot comments across re-runs. Do not change to
          # github-pr-review without re-verifying that.
          reporter: github-pr-check
          fail_level: any
          golangci_lint_flags: '--timeout=5m'
      - name: Custom repository rules
        run: python3 scripts/review_guard.py --ci
  fork-safe-review:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository safety rules (no elevated token)
        run: python3 scripts/review_guard.py --ci
