name: Python API Quality Gates
on:
  push:
    branches: [main, staging, develop]
    paths: ['apps/python-api/**', '.github/workflows/python-ci.yml']
  pull_request:
    paths: ['apps/python-api/**', '.github/workflows/python-ci.yml']
permissions:
  contents: read
jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/python-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies (lockfile-pinned, reproducible)
        run: pip install -r requirements-lock.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy, strict)
        run: mypy app
      - name: Tests
        run: python -m pytest -v
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/python-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.0.0
        with:
          python-version: '3.12'
      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install --quiet pip-audit==2.7.3
          pip-audit --requirement requirements-lock.txt
  python-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/python-api/Dockerfile
          failure-threshold: warning
          # DL3025 (use JSON-array ENTRYPOINT): deliberately NOT applied.
          # This Dockerfile's shell-form ENTRYPOINT is required for ${PORT}
          # expansion — exec-form cannot perform environment-variable
          # substitution, and switching to it was a real bug caught and
          # fixed during F3 (see docs/adr/0004-f3-application-foundation.md,
          # "a real config/Docker bug caught and fixed, not shipped").
          # DL3066 (info: non-numeric USER "appuser") is below the
          # failure-threshold and not ignored explicitly — informational,
          # not actioned (see docs/adr/0005-f4-security-supply-chain.md).
          ignore: DL3025
      - name: Dockerfile misconfiguration scan (Trivy config)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: apps/python-api/Dockerfile
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Build image locally (not pushed to any registry)
        run: docker build -t forgestack-python-api:ci-scan apps/python-api
      - name: Scan built image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: forgestack-python-api:ci-scan
          exit-code: '1'
          severity: HIGH,CRITICAL
          # issue #40, 2026-11-14: bookworm (98 findings, 2 critical) ->
          # trixie (47, 0 critical) -> python:3.12-alpine (0 HIGH/CRITICAL,
          # confirmed by an unfiltered scan, after two targeted `apk
          # upgrade` pins -- krb5-libs, zlib -- cleared the base image's
          # last 16 fixable findings). No `ignore-unfixed` exception is
          # needed anymore: there is nothing left to suppress. Verified
          # compatible before switching at each step (full test suite,
          # build, run, /healthz all pass unchanged) -- see
          # apps/python-api/Dockerfile's own comment for the full history.
          # If a future scan finds a genuinely unfixed OS CVE here, this
          # gate should fail loudly -- re-add a scoped, dated, justified
          # exception (docs/security/findings-register.json) rather than
          # reintroducing a blanket ignore-unfixed as a reflex.
      - name: Container smoke test (runs as non-root, healthz responds)
        run: |
          docker run -d --name python-api-smoke -p 18081:8081 forgestack-python-api:ci-scan
          trap 'docker logs python-api-smoke || true; docker rm -f python-api-smoke || true' EXIT
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18081/healthz > /tmp/healthz.json; then break; fi
            sleep 1
          done
          cat /tmp/healthz.json
          grep -q '"status":"ok"' /tmp/healthz.json || grep -q '"status": "ok"' /tmp/healthz.json
          uid="$(docker inspect --format '{{.Config.User}}' python-api-smoke)"
          echo "container user: $uid"
          [ "$uid" != "root" ] && [ -n "$uid" ]
