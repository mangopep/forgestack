name: Trusted Release
# Publishes a versioned, signed, SBOM'd release. Triggers ONLY on a pushed
# `v*` tag -- never on pull_request. `validate-tag`'s ancestry guard
# (scripts/check-tag-ancestry.sh) enforces that the tagged commit is
# actually reachable from `main` with a real `git merge-base
# --is-ancestor` check, not documented practice alone -- see
# docs/RELEASES.md. This mirrors supply-chain-attest.yml's own trust
# boundary: privileged credentials (GHCR push, GitHub Release creation,
# Sigstore signing) are only ever requested in this trusted, tag-push
# context, never from PR-triggered code, and now only after the tag has
# been proven to point at main's own history.
#
# NOT YET VERIFIED end-to-end (requires a real tag push, which this phase
# does not do -- see docs/adr/0006-f5-templates-releases.md).
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history required -- the ancestry guard below fails closed on a shallow clone, it does not trust one
      - name: Fetch main (the ancestry guard needs a local ref for it)
        run: git fetch origin main
      - name: "Guard: the tagged commit must be reachable from main"
        # Documented practice alone ("tags should only come from main")
        # is not enforcement -- this is a real git-ancestry check, tested
        # against real fixtures in scripts/test-check-tag-ancestry.sh
        # (valid main commit / feature-only commit / missing commit or
        # ref / shallow clone, all verified to behave correctly). Runs
        # before SemVer validation, the duplicate-release check, and
        # every downstream job -- nothing builds, signs, or publishes
        # if this fails.
        run: scripts/check-tag-ancestry.sh "${{ github.sha }}" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
      - name: Validate the pushed tag is real SemVer
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          go run ./cmd/semvercheck validate "$tag"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite an existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF#refs/tags/}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release already exists for ${GITHUB_REF#refs/tags/} -- refusing to overwrite. Delete it explicitly first if this is intentional, or push a new patch/minor tag."
            exit 1
          fi
          echo "No existing release for this tag -- proceeding."

  build-test-scan:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
      - name: Test
        run: go test -race ./...
      - name: "Build release images (not pushed yet -- that's the publish job, gated separately)"
        # --build-arg VERSION matches exactly what the publish job will
        # pass -- this is what actually caught v0.1.0's real bug: a
        # separate native `go build -ldflags ...` here (the previous
        # version of this step) exercised different code than what the
        # Docker build actually ran, so it passed while the real,
        # published image silently kept reporting "dev". Building the
        # real image here, with the real build-arg, is the only way this
        # check means anything.
        run: |
          docker build --build-arg "VERSION=${{ needs.validate-tag.outputs.version }}" -t forgestack:release-candidate .
          docker build --build-arg "VERSION=${{ needs.validate-tag.outputs.version }}" -t forgestack-python-api:release-candidate apps/python-api
      - name: "Verify the built images actually report the release version (not \"dev\"/\"docker-build\")"
        run: scripts/verify-release-image-version.sh forgestack:release-candidate 8080 "${{ needs.validate-tag.outputs.version }}"
      - name: Verify the Python image too
        run: scripts/verify-release-image-version.sh forgestack-python-api:release-candidate 8081 "${{ needs.validate-tag.outputs.version }}"
      - name: Scan both images (same gate as every other build -- a release is not exempt)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: forgestack:release-candidate
          exit-code: '1'
          severity: HIGH,CRITICAL
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: forgestack-python-api:release-candidate
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true' # same documented exception as python-ci.yml -- see issue #40

  publish:
    needs: [validate-tag, build-test-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write     # create the GitHub Release
      packages: write     # push to GHCR
      id-token: write      # short-lived OIDC identity for Sigstore keyless signing
      attestations: write  # GitHub-native build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'

      - name: Resolve the lowercase repository path GHCR requires
        # GHCR rejects any uppercase character in an image path; this
        # computes it once here so every later step (push, digest
        # resolution, signing, attestation) references the exact same
        # value `docker build` used, instead of repeating the lowercasing
        # (or forgetting to) in each one.
        id: repo
        run: echo "path=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: "Preflight: confirm push access to both GHCR repository paths before building anything"
        # v0.1.0's real failure was a registry-level "denied" discovered
        # only after build/scan/sign had already run for one of the two
        # images. This probes push permission for BOTH package paths up
        # front (via a blob-upload session that is immediately cancelled
        # -- nothing becomes publishable) so a naming/permission problem
        # fails here, before any image is built.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/preflight-registry-push-access.sh "${{ steps.repo.outputs.path }}" "${{ github.actor }}" "$GH_TOKEN"
          scripts/preflight-registry-push-access.sh "${{ steps.repo.outputs.path }}-python-api" "${{ github.actor }}" "$GH_TOKEN"

      - name: Build release images
        run: |
          docker build --build-arg "VERSION=${{ needs.validate-tag.outputs.version }}" -t "ghcr.io/${{ steps.repo.outputs.path }}:${{ needs.validate-tag.outputs.version }}" .
          docker build --build-arg "VERSION=${{ needs.validate-tag.outputs.version }}" -t "ghcr.io/${{ steps.repo.outputs.path }}-python-api:${{ needs.validate-tag.outputs.version }}" apps/python-api
      - name: "Verify the images about to be published report the release version"
        run: |
          scripts/verify-release-image-version.sh "ghcr.io/${{ steps.repo.outputs.path }}:${{ needs.validate-tag.outputs.version }}" 8080 "${{ needs.validate-tag.outputs.version }}"
          scripts/verify-release-image-version.sh "ghcr.io/${{ steps.repo.outputs.path }}-python-api:${{ needs.validate-tag.outputs.version }}" 8081 "${{ needs.validate-tag.outputs.version }}"

      - name: "Create SBOM output directory (SBOMs reuse F4's cmd/sbomcheck, not a parallel tool)"
        run: mkdir -p sboms
      - name: Generate Go image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: "ghcr.io/${{ steps.repo.outputs.path }}:${{ needs.validate-tag.outputs.version }}"
          format: cyclonedx-json
          output-file: sboms/sbom-go-raw.cdx.json
      - name: Generate Python image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: "ghcr.io/${{ steps.repo.outputs.path }}-python-api:${{ needs.validate-tag.outputs.version }}"
          format: cyclonedx-json
          output-file: sboms/sbom-python-raw.cdx.json
      - name: Augment + validate
        run: |
          for f in sboms/*-raw.cdx.json; do
            name="$(basename "$f" | sed 's/-raw//')"
            go run ./cmd/sbomcheck augment --producer "ForgeStack Release" \
              --repository "${{ github.repository }}" --commit "${{ github.sha }}" \
              "$f" "sboms/$name"
            go run ./cmd/sbomcheck validate "sboms/$name"
          done

      - name: Log in to GHCR
        # NOT YET VERIFIED -- requires a live tag push with registry
        # permission, which this phase does not perform.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: "Push images (immutable: tag matches the validated release version, never :latest alone)"
        run: |
          docker push "ghcr.io/${{ steps.repo.outputs.path }}:${{ needs.validate-tag.outputs.version }}"
          docker push "ghcr.io/${{ steps.repo.outputs.path }}-python-api:${{ needs.validate-tag.outputs.version }}"

      - name: Resolve pushed image digests (the immutable reference, not the mutable tag)
        id: digests
        run: |
          go_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/${{ steps.repo.outputs.path }}:${{ needs.validate-tag.outputs.version }}")"
          py_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/${{ steps.repo.outputs.path }}-python-api:${{ needs.validate-tag.outputs.version }}")"
          echo "go_digest=$go_digest" >> "$GITHUB_OUTPUT"
          echo "py_digest=$py_digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v3.9.3
        with:
          cosign-release: 'v2.6.5'

      - name: Sign the pushed image digests (keyless, bound to the immutable digest, not the tag)
        run: |
          cosign sign --yes "${{ steps.digests.outputs.go_digest }}"
          cosign sign --yes "${{ steps.digests.outputs.py_digest }}"

      - name: Attest build provenance for the Go image digest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: "ghcr.io/${{ steps.repo.outputs.path }}"
          subject-digest: "${{ steps.digests.outputs.go_digest }}"
      - name: Attest build provenance for the Python image digest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: "ghcr.io/${{ steps.repo.outputs.path }}-python-api"
          subject-digest: "${{ steps.digests.outputs.py_digest }}"

      - name: Create the GitHub Release (atomically last -- nothing above is user-visible until this succeeds)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.validate-tag.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "${{ needs.validate-tag.outputs.version }}" \
            --notes "Source commit: ${{ github.sha }}. Go image: ${{ steps.digests.outputs.go_digest }}. Python image: ${{ steps.digests.outputs.py_digest }}. SBOMs and signatures attached." \
            sboms/sbom-go.cdx.json sboms/sbom-python.cdx.json

      - name: "PARTIAL RELEASE: report exact state, do not assume anything below this point happened"
        # Runs only if an earlier step in this job failed. A failed
        # `publish` job must never be read as "nothing happened" -- some
        # steps before the failure point may have already pushed an
        # image, uploaded blobs, or taken another partially-visible
        # action. This makes that explicit in the job summary rather
        # than relying on a reader to infer it from which steps show a
        # red X. See docs/RELEASES.md's "v0.1.0 failed-attempt history"
        # for exactly this scenario, including why no image is ever
        # deleted or retagged automatically to "fix" a partial failure --
        # that decision requires a human to look at the actual state
        # first (gh release view, docker manifest inspect, cosign
        # verify), per docs/RELEASES.md's recovery procedure.
        if: failure()
        run: |
          {
            echo "## :rotating_light: Partial release failure for ${{ needs.validate-tag.outputs.version }}"
            echo ""
            echo "One or more steps in this job failed. Do NOT assume the release did not happen --"
            echo "check each of these explicitly before taking any action:"
            echo ""
            echo "- \`docker manifest inspect ghcr.io/${{ steps.repo.outputs.path }}:${{ needs.validate-tag.outputs.version }}\`"
            echo "- \`docker manifest inspect ghcr.io/${{ steps.repo.outputs.path }}-python-api:${{ needs.validate-tag.outputs.version }}\`"
            echo "- \`gh release view ${{ needs.validate-tag.outputs.version }} --repo ${{ github.repository }}\`"
            echo "- \`cosign verify\` against both image references above"
            echo ""
            echo "See docs/RELEASES.md's recovery procedure. Never delete, retag, or replace a"
            echo "published artifact as a reflex -- confirm the real state first."
          } >> "$GITHUB_STEP_SUMMARY"
