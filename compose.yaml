name: crushly-lab
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    profiles: ["data"]
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: crushly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d crushly"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    profiles: ["data"]
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    profiles: ["analytics"]
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: lab
      CLICKHOUSE_USER: labuser
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-development-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
volumes:
  postgres_data:
  clickhouse_data:
